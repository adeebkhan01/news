<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Nothing on this page may run, load or connect unless it is named here.
     script-src is 'self' plus one hash: the page's own files, and the
     inline theme bootstrap that has to run before first paint to avoid a
     flash. No 'unsafe-inline' on scripts or styles, so an injected tag
     cannot execute even if one ever got through — and nothing does, because
     feed text reaches the DOM as text nodes rather than as markup.
     img-src names the publishers' CDNs one by one, mirroring IMAGE_DOMAINS
     in lib/security.js; tests/security.test.js fails if the two drift.
     frame-ancestors is omitted deliberately: it is ignored in a meta CSP
     and needs a real header, which GitHub Pages will not serve. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-fZ21OHFTlZGA1hOkTvMIcS92235qeNGBK+384Rw3HMo='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://abc-cdn.net.au https://*.abc-cdn.net.au https://abc.net.au https://*.abc.net.au https://akamaized.net https://*.akamaized.net https://aljazeera.com https://*.aljazeera.com https://bbc.co.uk https://*.bbc.co.uk https://bbc.com https://*.bbc.com https://bbci.co.uk https://*.bbci.co.uk https://cloudfront.net https://*.cloudfront.net https://cnn.com https://*.cnn.com https://dhakatribune.com https://*.dhakatribune.com https://dw.com https://*.dw.com https://ffx.io https://*.ffx.io https://france24.com https://*.france24.com https://guim.co.uk https://*.guim.co.uk https://newagebd.net https://*.newagebd.net https://npr.org https://*.npr.org https://prothomalo.com https://*.prothomalo.com https://risingbd.com https://*.risingbd.com https://smh.com.au https://*.smh.com.au https://theconversation.com https://*.theconversation.com https://thedailystar.net https://*.thedailystar.net https://theguardian.com https://*.theguardian.com https://unb.com.bd https://*.unb.com.bd https://wp.com https://*.wp.com; connect-src 'self'; base-uri 'none'; form-action 'none'" />
<meta name="description" content="A clean, fast news reader for Bangladesh, Australia and the world — headlines from trusted sources, updated continuously." />
<meta name="theme-color" content="#fdfcfb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
<title>Daily Digest — Bangladesh · Australia · Global</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fdfcfb'/%3E%3Crect x='4' y='7' width='16' height='18' fill='%230e1729'/%3E%3Crect x='23' y='7' width='5' height='18' fill='%23d4a418'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Tiro+Bangla&display=swap" rel="stylesheet" />
<script>
  (function () {
    var stored = localStorage.getItem('news-theme');
    if (stored === 'dark') stored = 'night';          // migrate the old value
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<a class="skip-link" href="#feed-container">Skip to headlines</a>

<header class="masthead">
  <div class="masthead-inner wrap">
    <a class="wordmark" href="index.html">
      <span>Daily Digest</span><span class="tick" aria-hidden="true"></span>
      <span class="edition" id="logo-edition">Bangladesh</span>
    </a>
    <div class="masthead-right">
      <span class="provenance" id="last-updated">—</span>
      <button class="btn" id="theme-toggle">
        <span id="theme-label">Night</span>
      </button>
      <button class="btn" id="lang-toggle" aria-label="Switch language" lang="bn">বাংলা</button>
      <button class="btn btn-primary" id="refresh-btn">
        <span id="refresh-label">Refresh</span>
      </button>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner wrap">
    <div class="field">
      <span class="label" id="region-label">Region</span>
      <div class="tabs" role="tablist" aria-labelledby="region-label">
        <button class="tab" role="tab" aria-selected="true" data-region="bd">Bangladesh</button>
        <button class="tab" role="tab" aria-selected="false" data-region="au">Australia</button>
        <button class="tab" role="tab" aria-selected="false" data-region="global">Global</button>
      </div>
    </div>
    <div class="field search">
      <label class="label" for="search-input">Search</label>
      <input id="search-input" type="search" autocomplete="off" placeholder="Filter headlines" />
      <span class="kbd-hint" id="kbd-hint">/</span>
      <button id="search-clear" aria-label="Clear search">&#10005;</button>
    </div>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-bar-inner wrap" id="filter-bar" role="group" aria-label="Filter by source">
    <button class="chip active" data-source="all">All sources</button>
  </div>
</div>

<main class="content-wrap">
  <div class="main-col">
    <section id="page-summary" hidden class="panel" aria-label="Briefing">
      <div class="brief-main">
        <div class="panel-head"><span class="label">Briefing</span></div>
        <div id="page-summary-text"></div>
        <button id="summary-toggle" aria-expanded="false">Read more</button>
      </div>
      <dl class="facts" id="brief-facts"></dl>
    </section>

    <div class="section-head">
      <h2>Headlines</h2>
      <span class="status-line">
        <span class="status-strip" id="status-strip">&#9679; Live</span>
        <span id="status-text">Loading</span>
        <span id="article-count"></span>
      </span>
    </div>
    <div id="feed-container"></div>
  </div>

  <aside class="sidebar">
    <div class="panel">
      <div class="panel-head">
        <span class="label">Latest</span>
        <span class="label" id="latest-provenance"></span>
      </div>
      <ul class="headlines-list" id="headlines-list"></ul>
    </div>
  </aside>
</main>

<button id="to-top" aria-label="Back to top">&#8593;</button>

<footer>
  <div class="foot-inner">
    <span>Daily Digest — Bangladesh, Australia, Global</span>
    <span id="foot-provenance">Refreshed twice daily via GitHub Actions</span>
  </div>
</footer>

<script src="app.js" defer></script>
</body>
</html>
