<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="A clean, fast news reader for Bangladesh, Australia and the world — headlines from trusted sources, updated continuously." />
<meta name="theme-color" content="#fdfcfb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
<title>Daily Digest — Bangladesh · Australia · Global</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fdfcfb'/%3E%3Crect x='4' y='7' width='16' height='18' fill='%230e1729'/%3E%3Crect x='23' y='7' width='5' height='18' fill='%23d4a418'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Tiro+Bangla&display=swap" rel="stylesheet" />
<script>
  (function () {
    var stored = localStorage.getItem('news-theme');
    if (stored === 'dark') stored = 'night';          // migrate the old value
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ─── Tokens ───────────────────────────────────────────────────────────
   Aparajita Brand Guidelines v1.0. Base scales below, semantic aliases
   after; components only ever reference the aliases, so the night theme
   re-points them without touching a rule. */
:root{
  /* paper */
  --paper-0:#ffffff;--paper-1:#fdfcfb;--paper-2:#f6f4f1;--paper-3:#eae6df;--paper-4:#ddd8cf;
  /* ink */
  --ink-0:#0e1729;--ink-1:#1b2a4a;--ink-2:#3d4f70;--ink-3:#5c6b85;
  --line-1:#8fa3bf;--line-2:#c3ccd9;
  /* signal gold */
  --gold-1:#d4a418;--gold-2:#b98c0c;--gold-ink:#6d5205;--gold-wash:#f7eccc;
  /* status — run states only */
  --ok-1:#2f7d54;--ok-wash:#e4f0e8;
  --warn-1:#b8761a;--warn-wash:#f8ecd9;
  --err-1:#a8321f;--err-wash:#f8e5e1;

  /* semantic aliases */
  --bg-page:var(--paper-1);--bg-surface:var(--paper-2);--bg-sunken:var(--paper-3);--bg-inverse:var(--ink-1);
  --text-heading:var(--ink-0);--text-body:var(--ink-1);--text-muted:var(--ink-3);
  --text-inverse:var(--paper-1);--text-accent:var(--gold-ink);
  --border-strong:var(--ink-1);--border-quiet:var(--line-1);--border-hairline:var(--line-2);
  --focus-ring:var(--gold-1);--selection-bg:var(--gold-wash);
  --edge-color:var(--line-2);--edge-color-strong:var(--ink-2);--edge-color-gold:var(--gold-2);

  /* type */
  --font-display:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-text:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-bangla:'Tiro Bangla',serif;   /* exception: no monospace Bengali face exists */
  --size-2xs:11px;--size-xs:12px;--size-sm:13px;--size-md:15px;--size-lg:18px;
  --size-xl:22px;--size-2xl:28px;--size-3xl:36px;--size-4xl:48px;--size-5xl:64px;
  --track-display:-0.03em;--track-label:0.14em;

  /* space */
  --space-1:2px;--space-2:4px;--space-3:8px;--space-4:12px;--space-5:16px;
  --space-6:24px;--space-7:32px;--space-8:48px;--space-9:64px;--space-10:96px;
  --gutter:24px;--section-y:64px;--measure:68ch;--page-max:1180px;
  --control-h-sm:26px;--control-h-md:34px;--control-h-lg:44px;

  /* edges */
  --radius:2px;--border-w:1px;--border-w-heavy:2px;
  --edge-1:2px 2px 0 0 var(--edge-color);
  --edge-2:4px 4px 0 0 var(--edge-color);
  --edge-3:6px 6px 0 0 var(--edge-color);
  --edge-strong:3px 3px 0 0 var(--edge-color-strong);
  --edge-none:0 0 0 0 var(--edge-color);
  --press-1:translate(2px,2px);--press-2:translate(4px,4px);
  --motion-fast:70ms;--motion-base:130ms;--ease:linear;--ease-smooth:cubic-bezier(.2,0,.2,1);
  --header-h:56px;
}

/* Night theme — same roles, ink and paper swapped. The guidelines flag this
   as untested, so it is a starting point rather than a finished surface. */
:root[data-theme="night"]{
  --bg-page:var(--ink-0);--bg-surface:#16233c;--bg-sunken:#0a101d;--bg-inverse:var(--paper-1);
  --text-heading:var(--paper-1);--text-body:#e6eaf1;--text-muted:var(--line-1);
  --text-inverse:var(--ink-0);--text-accent:var(--gold-1);
  --border-strong:var(--line-1);--border-quiet:#35486b;--border-hairline:#253352;
  --edge-color:#060b14;--edge-color-strong:#060b14;
}

html{font-size:16px;-webkit-text-size-adjust:100%;font-family:var(--font-text)}
body{
  background:var(--bg-page);color:var(--text-body);
  font-family:var(--font-text);font-size:var(--size-md);line-height:1.5;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
a{color:inherit}
::selection{background:var(--selection-bg)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
[lang="bn"]{font-family:var(--font-bangla);line-height:1.6}
/* Colour transitions are suppressed while the theme swaps so the document
   doesn't animate every border at once. */
:root.theme-switch *,:root.theme-switch *::before,:root.theme-switch *::after{transition:none!important}

.wrap{max-width:var(--page-max);margin:0 auto;padding:0 var(--gutter)}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--ink-1);color:var(--paper-1);
  padding:var(--space-3) var(--space-5);z-index:300;font-family:var(--font-display);font-size:var(--size-sm)}
.skip-link:focus{left:0}

/* Micro-label: 11px, uppercase, +0.14em. Sits above every section, field
   and table header — the most recognisable thing in the system. */
.label{
  font-family:var(--font-display);font-weight:700;font-size:var(--size-2xs);line-height:1;
  text-transform:uppercase;letter-spacing:var(--track-label);color:var(--text-muted);
}

/* ─── Masthead ─────────────────────────────────────────────────────── */
.masthead{
  position:sticky;top:0;z-index:100;background:var(--bg-page);
  box-shadow:inset 0 -3px 0 var(--border-hairline);   /* inset, never a drop shadow */
}
.masthead-inner{display:flex;align-items:center;gap:var(--space-5);height:var(--header-h)}
.wordmark{
  display:flex;align-items:baseline;gap:.2em;text-decoration:none;flex-shrink:0;
  font-family:var(--font-display);font-weight:700;font-size:var(--size-lg);
  letter-spacing:0.03em;text-transform:uppercase;color:var(--text-heading);
}
/* The one gold thing on this view. Tick height = cap height, width ~0.4x. */
.wordmark .tick{width:.4em;height:.72em;background:var(--gold-1);display:inline-block;flex-shrink:0}
.wordmark .edition{
  font-size:var(--size-2xs);letter-spacing:var(--track-label);color:var(--text-muted);
  padding-left:var(--space-4);margin-left:var(--space-2);align-self:center;
}
.masthead-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
.provenance{
  font-family:var(--font-text);font-size:var(--size-xs);color:var(--text-muted);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}

/* ─── Buttons ──────────────────────────────────────────────────────── */
.btn{
  font-family:var(--font-display);font-weight:700;font-size:var(--size-sm);line-height:1;
  text-transform:uppercase;letter-spacing:.02em;
  height:var(--control-h-md);padding:0 var(--space-4);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  background:var(--bg-surface);color:var(--text-body);
  border:var(--border-w) solid var(--border-strong);border-radius:var(--radius);
  box-shadow:var(--edge-1);cursor:pointer;
  transition:background var(--motion-fast) var(--ease),color var(--motion-fast) var(--ease);
}
.btn:hover{background:var(--bg-sunken)}
.btn:active{transform:var(--press-1);box-shadow:var(--edge-none)}   /* travels into its own edge */
.btn-primary{background:var(--bg-inverse);color:var(--text-inverse);box-shadow:2px 2px 0 0 var(--edge-color-strong)}
.btn-primary:hover{filter:brightness(.92)}
.btn[disabled]{background:var(--bg-sunken);border-color:var(--border-hairline);color:var(--text-muted);box-shadow:none;cursor:default}
.btn[disabled]:active{transform:none}

/* ─── Toolbar: region tabs + search ────────────────────────────────── */
.toolbar{background:var(--bg-surface);border-bottom:var(--border-w) solid var(--border-strong)}
.toolbar-inner{display:flex;align-items:flex-end;gap:var(--space-6);padding:var(--space-4) 0;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:var(--space-2)}
.field .label{display:block}

/* Boxed tabs: active is a lifted paper tab, so gold stays on the wordmark. */
.tabs{display:flex;gap:var(--space-1);flex-shrink:0}
.tab{
  font-family:var(--font-display);font-weight:700;font-size:var(--size-sm);line-height:1;
  text-transform:uppercase;letter-spacing:.02em;
  height:var(--control-h-md);padding:0 var(--space-4);
  background:transparent;color:var(--text-muted);
  border:var(--border-w) solid var(--border-hairline);border-radius:var(--radius);
  cursor:pointer;white-space:nowrap;
  transition:background var(--motion-fast) var(--ease),color var(--motion-fast) var(--ease);
}
.tab:hover{background:var(--bg-sunken);color:var(--text-body)}
.tab[aria-selected="true"]{
  background:var(--bg-page);color:var(--text-heading);
  border-color:var(--border-strong);box-shadow:var(--edge-1);
}

.search{position:relative;flex:1;min-width:240px}
/* Inputs are inset — raised acts, inset receives. */
#search-input{
  width:100%;height:var(--control-h-md);
  background:var(--bg-page);color:var(--text-body);
  font-family:var(--font-text);font-size:var(--size-sm);
  border:var(--border-w) solid var(--border-strong);border-radius:var(--radius);
  box-shadow:inset 2px 2px 0 var(--border-hairline);
  padding:0 var(--space-8) 0 var(--space-3);outline:none;
}
#search-input::placeholder{color:var(--text-muted)}
#search-input::-webkit-search-cancel-button{display:none}
.kbd-hint{
  position:absolute;right:var(--space-3);bottom:10px;pointer-events:none;
  font-family:var(--font-display);font-size:var(--size-2xs);color:var(--text-muted);
}
#search-clear{
  position:absolute;right:var(--space-2);bottom:5px;display:none;
  width:24px;height:24px;line-height:1;
  background:none;border:none;color:var(--text-muted);cursor:pointer;
  font-family:var(--font-display);font-size:var(--size-sm);
}
#search-clear:hover{color:var(--text-body)}

/* ─── Source filter ────────────────────────────────────────────────── */
.filter-bar{background:var(--bg-page);border-bottom:var(--border-w) solid var(--border-hairline)}
.filter-bar-inner{display:flex;gap:var(--space-2);padding:var(--space-3) 0;overflow-x:auto;scrollbar-width:none;align-items:center}
.filter-bar-inner::-webkit-scrollbar{display:none}
.chip{
  font-family:var(--font-display);font-weight:700;font-size:var(--size-2xs);line-height:1;
  text-transform:uppercase;letter-spacing:var(--track-label);
  height:var(--control-h-sm);padding:0 var(--space-3);
  display:inline-flex;align-items:center;gap:var(--space-3);flex-shrink:0;
  background:transparent;color:var(--text-muted);
  border:var(--border-w) solid var(--border-hairline);border-radius:var(--radius);cursor:pointer;
  transition:background var(--motion-fast) var(--ease),color var(--motion-fast) var(--ease);
}
.chip:hover{background:var(--bg-sunken);color:var(--text-body)}
.chip.active{background:var(--bg-inverse);border-color:var(--bg-inverse);color:var(--text-inverse)}
.chip .count{font-family:var(--font-text);font-weight:400;letter-spacing:0;font-variant-numeric:tabular-nums;opacity:.75}

/* ─── Layout ───────────────────────────────────────────────────────── */
.content-wrap{
  max-width:var(--page-max);margin:0 auto;padding:var(--space-7) var(--gutter) var(--space-9);
  display:grid;grid-template-columns:1fr 300px;gap:var(--space-7);align-items:start;
}
.main-col{min-width:0}

/* Section opener: micro-label + title on a 1px hard rule. */
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-5);
  padding-bottom:var(--space-3);margin-bottom:var(--space-5);
  border-bottom:var(--border-w) solid var(--border-strong);
}
.section-head h2{
  font-family:var(--font-display);font-weight:700;font-size:var(--size-xl);line-height:1.25;
  letter-spacing:var(--track-display);color:var(--text-heading);
}
.status-line{
  display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;
  font-family:var(--font-text);font-size:var(--size-sm);color:var(--text-muted);
  font-variant-numeric:tabular-nums;
}
.status-strip{
  display:inline-flex;align-items:center;gap:var(--space-2);
  padding:2px var(--space-3);border-radius:var(--radius);
  border:var(--border-w) solid var(--ok-1);background:var(--ok-wash);color:var(--ok-1);
  font-family:var(--font-display);font-weight:700;font-size:var(--size-2xs);
  text-transform:uppercase;letter-spacing:var(--track-label);
}
.status-strip.warn{border-color:var(--warn-1);background:var(--warn-wash);color:var(--warn-1)}
.status-strip.err{border-color:var(--err-1);background:var(--err-wash);color:var(--err-1)}

/* ─── Briefing panel ───────────────────────────────────────────────── */
.panel{
  background:var(--bg-surface);
  border:var(--border-w) solid var(--border-strong);border-radius:var(--radius);
  box-shadow:var(--edge-strong);padding:var(--space-5);
}
.panel + .panel{margin-top:var(--space-6)}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-3)}
#page-summary{margin-bottom:var(--space-6)}
#page-summary-text{font-size:var(--size-md);line-height:1.5;max-width:var(--measure);color:var(--text-body)}
#summary-toggle{
  display:none;margin-top:var(--space-3);padding:0;background:none;border:none;cursor:pointer;
  font-family:var(--font-display);font-weight:700;font-size:var(--size-2xs);
  text-transform:uppercase;letter-spacing:var(--track-label);color:var(--text-accent);
}

/* ─── Cards ────────────────────────────────────────────────────────── */
.grid,.loading-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--space-5)}
.card{
  position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--bg-page);
  border:var(--border-w) solid var(--border-strong);border-radius:var(--radius);
  box-shadow:var(--edge-strong);
  transition:background var(--motion-fast) var(--ease);
}
.card:hover{background:var(--bg-surface)}
.card:active{transform:translate(3px,3px);box-shadow:var(--edge-none)}
.grid > .card{content-visibility:auto;contain-intrinsic-size:auto 320px}
.grid > .card.featured{content-visibility:visible}

.thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--bg-sunken);flex-shrink:0;
  border-bottom:var(--border-w) solid var(--border-strong)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
/* Striped placeholder: 135deg paper-2/paper-3, captioned with what belongs there. */
.thumb.placeholder{
  display:grid;place-items:center;
  background:repeating-linear-gradient(135deg,var(--paper-2) 0 8px,var(--paper-3) 8px 16px);
}
:root[data-theme="night"] .thumb.placeholder{
  background:repeating-linear-gradient(135deg,var(--bg-surface) 0 8px,var(--bg-sunken) 8px 16px);
}
.thumb.placeholder .cap{
  font-family:var(--font-display);font-weight:700;font-size:var(--size-2xs);
  text-transform:uppercase;letter-spacing:var(--track-label);color:var(--text-muted);
  text-align:center;padding:0 var(--space-4);
}

.card-body{padding:var(--space-5);flex:1;display:flex;flex-direction:column;gap:var(--space-3)}
.card-title{
  font-family:var(--font-display);font-weight:700;font-size:var(--size-md);line-height:1.25;
  letter-spacing:var(--track-display);color:var(--text-heading);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.card-desc{
  font-size:var(--size-sm);line-height:1.5;color:var(--text-muted);max-width:var(--measure);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
/* Provenance row: source left, freshness right, on a dashed hairline. */
.card-meta{
  margin-top:auto;padding-top:var(--space-3);
  border-top:var(--border-w) dashed var(--border-hairline);
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);
  font-family:var(--font-display);font-weight:700;font-size:var(--size-2xs);
  text-transform:uppercase;letter-spacing:var(--track-label);color:var(--text-muted);
}
.card-meta .age{font-family:var(--font-text);font-weight:400;letter-spacing:0;font-variant-numeric:tabular-nums}

.card.featured{grid-column:1/-1;flex-direction:row;align-items:stretch}
.card.featured .thumb{width:46%;aspect-ratio:auto;min-height:260px;border-bottom:none;
  border-right:var(--border-w) solid var(--border-strong)}
.card.featured .card-body{padding:var(--space-6);justify-content:center;gap:var(--space-4)}
.card.featured .card-title{font-size:var(--size-2xl);line-height:1.08;-webkit-line-clamp:4}
.card.featured .card-desc{font-size:var(--size-md);-webkit-line-clamp:3}
.lead-badge{
  align-self:flex-start;
  font-family:var(--font-display);font-weight:700;font-size:var(--size-2xs);line-height:1;
  text-transform:uppercase;letter-spacing:var(--track-label);
  color:var(--text-inverse);background:var(--bg-inverse);
  padding:var(--space-2) var(--space-3);border-radius:var(--radius);
}
@media(max-width:820px){
  .card.featured{flex-direction:column}
  .card.featured .thumb{width:100%;aspect-ratio:16/9;min-height:0;
    border-right:none;border-bottom:var(--border-w) solid var(--border-strong)}
  .card.featured .card-body{padding:var(--space-5)}
  .card.featured .card-title{font-size:var(--size-xl)}
}
.highlight{background:var(--selection-bg);color:inherit}
.feed-sentinel{display:flex;justify-content:center;padding:var(--space-6) 0 var(--space-2)}

/* ─── Facts panel: key/value rows on dashed hairlines ──────────────── */
.sidebar{position:sticky;top:calc(var(--header-h) + var(--space-5));
  max-height:calc(100vh - var(--header-h) - var(--space-7));overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--border-quiet) transparent}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border-quiet)}
.headlines-list{list-style:none}
.headline-item{
  display:grid;grid-template-columns:auto 1fr;column-gap:var(--space-3);align-items:start;
  padding:var(--space-3) 0;border-bottom:var(--border-w) dashed var(--border-hairline);
}
.headline-item:first-child{padding-top:0}
.headline-item:last-child{border-bottom:none;padding-bottom:0}
.headline-item::before{
  counter-increment:hl;content:counter(hl,decimal-leading-zero);grid-row:1/3;
  font-family:var(--font-display);font-weight:700;font-size:var(--size-2xs);color:var(--text-muted);
  padding-top:2px;
}
.headlines-list{counter-reset:hl}
.headline-title{
  font-family:var(--font-display);font-weight:700;font-size:var(--size-sm);line-height:1.25;
  letter-spacing:var(--track-display);color:var(--text-heading);text-decoration:none;display:block;
}
.headline-title:hover{color:var(--text-accent)}
.headline-time{display:block;margin-top:2px;font-size:var(--size-xs);color:var(--text-muted);font-variant-numeric:tabular-nums}

/* ─── Loading, empty, error ────────────────────────────────────────── */
/* No shimmer: progress is reported in words, not motion. */
.skeleton{border:var(--border-w) solid var(--border-hairline);border-radius:var(--radius);background:var(--bg-page)}
.skeleton-thumb{aspect-ratio:16/9;background:repeating-linear-gradient(135deg,var(--paper-2) 0 8px,var(--paper-3) 8px 16px)}
:root[data-theme="night"] .skeleton-thumb{background:repeating-linear-gradient(135deg,var(--bg-surface) 0 8px,var(--bg-sunken) 8px 16px)}
.skeleton-body{padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.skeleton-line{height:11px;background:var(--bg-sunken)}

.notice{
  border:var(--border-w) solid var(--border-strong);border-radius:var(--radius);
  box-shadow:var(--edge-strong);background:var(--bg-surface);padding:var(--space-6);
}
.notice h3{font-family:var(--font-display);font-weight:700;font-size:var(--size-lg);
  letter-spacing:var(--track-display);color:var(--text-heading);margin-bottom:var(--space-3)}
.notice p{font-size:var(--size-sm);line-height:1.5;max-width:var(--measure);color:var(--text-body)}
.notice p + p{margin-top:var(--space-3)}
.notice.error{border-color:var(--err-1);background:var(--err-wash);box-shadow:3px 3px 0 0 var(--err-1)}
.notice.error h3{color:var(--err-1)}

/* ─── Footer ───────────────────────────────────────────────────────── */
footer{
  border-top:var(--border-w) solid var(--border-strong);background:var(--bg-surface);
  margin-top:var(--space-9);padding:var(--space-6) 0;
}
.foot-inner{max-width:var(--page-max);margin:0 auto;padding:0 var(--gutter);
  display:flex;justify-content:space-between;gap:var(--space-5);flex-wrap:wrap;
  font-size:var(--size-xs);color:var(--text-muted)}

#to-top{
  position:fixed;right:var(--gutter);bottom:var(--gutter);z-index:90;
  width:var(--control-h-lg);height:var(--control-h-lg);
  display:none;place-items:center;cursor:pointer;
  font-family:var(--font-display);font-weight:700;font-size:var(--size-md);
  background:var(--bg-surface);color:var(--text-body);
  border:var(--border-w) solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--edge-1);
}
#to-top.show{display:grid}
#to-top:active{transform:var(--press-1);box-shadow:var(--edge-none)}

/* ─── Responsive ───────────────────────────────────────────────────── */
@media(max-width:980px){
  .content-wrap{grid-template-columns:1fr;gap:var(--space-6)}
  .sidebar{position:static;max-height:none;overflow:visible}
}
@media(max-width:700px){
  :root{--gutter:16px}
  .grid,.loading-grid{grid-template-columns:1fr}
  .wordmark .edition{display:none}
  .kbd-hint{display:none}
  #summary-toggle{display:inline-block}
  #page-summary-text.clamped{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
}
@media(max-width:560px){
  .masthead-inner{height:auto;padding:var(--space-3) 0;flex-wrap:wrap;gap:var(--space-3)}
  .wordmark{width:100%;font-size:var(--size-md)}
  .masthead-right{margin-left:0;width:100%;flex-wrap:wrap;gap:var(--space-2)}
  .masthead-right .btn{flex:1;padding:0 var(--space-2)}
  .provenance{display:none}
  .toolbar-inner{gap:var(--space-4)}
  .tabs{width:100%}
  .tab{flex:1;padding:0 var(--space-2)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important}
}
</style>
</head>
<body>
<a class="skip-link" href="#feed-container">Skip to headlines</a>

<header class="masthead">
  <div class="masthead-inner wrap">
    <a class="wordmark" href="index.html">
      <span>Daily Digest</span><span class="tick" aria-hidden="true"></span>
      <span class="edition" id="logo-edition">Bangladesh</span>
    </a>
    <div class="masthead-right">
      <span class="provenance" id="last-updated">—</span>
      <button class="btn" id="theme-toggle" onclick="toggleTheme()">
        <span id="theme-label">Night</span>
      </button>
      <button class="btn" id="lang-toggle" onclick="toggleLang()" aria-label="Switch language" lang="bn">বাংলা</button>
      <button class="btn btn-primary" id="refresh-btn" onclick="loadData()">
        <span id="refresh-label">Refresh</span>
      </button>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner wrap">
    <div class="field">
      <span class="label" id="region-label">Region</span>
      <div class="tabs" role="tablist" aria-labelledby="region-label">
        <button class="tab" role="tab" aria-selected="true" data-region="bd" onclick="switchRegion('bd',this)">Bangladesh</button>
        <button class="tab" role="tab" aria-selected="false" data-region="au" onclick="switchRegion('au',this)">Australia</button>
        <button class="tab" role="tab" aria-selected="false" data-region="global" onclick="switchRegion('global',this)">Global</button>
      </div>
    </div>
    <div class="field search">
      <label class="label" for="search-input">Search</label>
      <input id="search-input" type="search" autocomplete="off" placeholder="Filter headlines" oninput="onSearch(this.value)" />
      <span class="kbd-hint" id="kbd-hint">/</span>
      <button id="search-clear" onclick="clearSearch()" aria-label="Clear search">&#10005;</button>
    </div>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-bar-inner wrap" id="filter-bar" role="group" aria-label="Filter by source">
    <button class="chip active" onclick="setFilter('all',this)">All sources</button>
  </div>
</div>

<main class="content-wrap">
  <div class="main-col">
    <section id="page-summary" style="display:none" class="panel" aria-label="Briefing">
      <div class="panel-head">
        <span class="label">Briefing</span>
        <span class="label" id="summary-provenance"></span>
      </div>
      <div id="page-summary-text"></div>
      <button id="summary-toggle" onclick="toggleSummary()" aria-expanded="false">Read more</button>
    </section>

    <div class="section-head">
      <h2>Headlines</h2>
      <span class="status-line">
        <span class="status-strip" id="status-strip">&#9679; Live</span>
        <span id="status-text">Loading</span>
        <span id="article-count"></span>
      </span>
    </div>
    <div id="feed-container"></div>
  </div>

  <aside class="sidebar">
    <div class="panel">
      <div class="panel-head">
        <span class="label">Latest</span>
        <span class="label" id="latest-provenance"></span>
      </div>
      <ul class="headlines-list" id="headlines-list"></ul>
    </div>
  </aside>
</main>

<button id="to-top" onclick="window.scrollTo({top:0})" aria-label="Back to top">&#8593;</button>

<footer>
  <div class="foot-inner">
    <span>Daily Digest — Bangladesh, Australia, Global</span>
    <span id="foot-provenance">Refreshed twice daily via GitHub Actions</span>
  </div>
</footer>

<script>
let allArticles  = [];
let allSources   = [];
let activeFilter = 'all';
let searchQuery  = '';
let loading      = false;
let langMode     = 'en';
let activeRegion = localStorage.getItem('news-region') || 'bd';
let searchTimer  = null;

const PAGE_SIZE = 24;
let visibleArticles = [];
let renderedCount   = 0;
let featuredIndex   = -1;
let feedObserver    = null;

const REGION_CONFIG = {
  bd:     { label: 'Bangladesh', mark: 'BD', dataFile: 'data-bd.json',     hasLang: true  },
  au:     { label: 'Australia',  mark: 'AU', dataFile: 'data-au.json',     hasLang: false },
  global: { label: 'Global',     mark: 'GL', dataFile: 'data-global.json', hasLang: false }
};

/* ── Theme ── */
function applyThemeLabel() {
  // The button names what it will do, so no icon has to be invented.
  document.getElementById('theme-label').textContent =
    document.documentElement.getAttribute('data-theme') === 'night' ? 'Day' : 'Night';
}

function toggleTheme() {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'night' ? 'day' : 'night';

  root.classList.add('theme-switch');
  root.setAttribute('data-theme', next);
  applyThemeLabel();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.classList.remove('theme-switch');
    localStorage.setItem('news-theme', next);
  }));
}
applyThemeLabel();

/* Status is always a glyph and a colour, never colour alone. */
const STATUS_GLYPH = { ok: '\u25CF', warn: '\u25B2', err: '\u2715' };
function setStatus(kind, word, detail) {
  const strip = document.getElementById('status-strip');
  strip.className = 'status-strip' + (kind === 'ok' ? '' : ' ' + kind);
  strip.textContent = STATUS_GLYPH[kind] + ' ' + word;
  document.getElementById('status-text').textContent = detail || '';
}

/* ── Helpers ── */
function escapeHTML(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]
  );
}

// Older data files were written before the feed parser learned to decode
// entities before stripping, so they still carry <p>, <br> and href URLs in
// the copy. Clean it at render time too, rather than waiting on a refetch.
function decodeEntities(str) {
  return str
    .replace(/&#(\d+);/g, (_, d) => String.fromCharCode(+d))
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/&nbsp;/g, ' ').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&amp;/g, '&');
}

function plainText(str) {
  let s = String(str == null ? '' : str);
  for (let i = 0; i < 3; i++) {
    const next = decodeEntities(s).replace(/<[^>]*>/g, ' ')
      .replace(/<[^>]*$/, ' ');   // descriptions get truncated mid-tag
    if (next === s) break;
    s = next;
  }
  return s.replace(/\s+/g, ' ').trim();
}

function safeURL(url) {
  const raw = String(url || '').trim();
  return /^https?:\/\//i.test(raw) ? escapeHTML(raw) : '';
}

// Takes raw text and escapes it here: highlighting escaped text let a query
// like "amp" or "quot" match inside an entity and break it apart.
function highlight(text, query) {
  const raw = String(text == null ? '' : text);
  if (!query) return escapeHTML(raw);
  const pattern = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // split() on a capturing group puts the matches at the odd indices.
  return raw.split(new RegExp('(' + pattern + ')', 'gi'))
    .map((part, i) => i % 2 ? '<span class="highlight">' + escapeHTML(part) + '</span>' : escapeHTML(part))
    .join('');
}

function timeAgo(dateStr) {
  const t = Date.parse(dateStr);
  if (!t) return '';
  const diff = (Date.now() - t) / 1000;
  if (diff < 60)    return 'just now';
  if (diff < 3600)  return Math.floor(diff / 60)    + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600)  + 'h ago';
  return                   Math.floor(diff / 86400) + 'd ago';
}

/* ── Language ── */
function toggleLang() {
  langMode = langMode === 'en' ? 'bn' : 'en';
  const btn = document.getElementById('lang-toggle');
  btn.textContent = langMode === 'bn' ? 'English' : 'বাংলা';
  btn.setAttribute('lang', langMode === 'bn' ? 'en' : 'bn');
  btn.classList.toggle('bn', langMode === 'bn');
  renderArticles();
  showHeadlines(allArticles);
}

/* ── Region ── */
function switchRegion(regionId, el) {
  if (regionId === activeRegion) return;
  activeRegion = regionId;
  localStorage.setItem('news-region', regionId);
  applyRegionChrome();

  document.querySelectorAll('.tab').forEach(c => {
    c.setAttribute('aria-selected', c === el ? 'true' : 'false');
  });

  activeFilter = 'all';
  clearSearch();
  loadData();
}

function applyRegionChrome() {
  const cfg = REGION_CONFIG[activeRegion];
  document.getElementById('logo-edition').textContent = cfg.label;
  document.title = 'Daily Digest — ' + cfg.label;

  const langBtn = document.getElementById('lang-toggle');
  langBtn.style.display = cfg.hasLang ? '' : 'none';
  if (!cfg.hasLang && langMode !== 'en') {
    langMode = 'en';
    langBtn.textContent = 'বাংলা';
    langBtn.setAttribute('lang', 'bn');
    langBtn.classList.remove('bn');
  }
}

/* ── Search ── */
function onSearch(val) {
  document.getElementById('search-clear').style.display = val ? 'block' : 'none';
  document.getElementById('kbd-hint').style.display = val ? 'none' : '';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = val.trim();
    renderArticles();
  }, 140);
}

function clearSearch() {
  searchQuery = '';
  const input = document.getElementById('search-input');
  input.value = '';
  document.getElementById('search-clear').style.display = 'none';
  document.getElementById('kbd-hint').style.display = '';
  renderArticles();
}

document.addEventListener('keydown', e => {
  const input = document.getElementById('search-input');
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); input.focus(); input.select(); }
  if (e.key === 'Escape' && document.activeElement === input) { clearSearch(); input.blur(); }
});

/* ── Filters ── */
function buildFilterBar() {
  const counts = {};
  allArticles.forEach(a => { counts[a.sourceId] = (counts[a.sourceId] || 0) + 1; });

  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'chip' + (activeFilter === 'all' ? ' active' : '');
  allBtn.textContent = 'All sources';
  allBtn.onclick = () => setFilter('all', allBtn);
  bar.appendChild(allBtn);

  allSources.forEach(s => {
    const count = counts[s.id] || 0;
    if (!count) return;
    const btn = document.createElement('button');
    btn.className = 'chip' + (activeFilter === s.id ? ' active' : '');
    btn.innerHTML = escapeHTML(s.name) + '<span class="count">' + count + '</span>';
    btn.onclick = () => setFilter(s.id, btn);
    bar.appendChild(btn);
  });
}

function setFilter(id, el) {
  activeFilter = id;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderArticles();
}

/* ── Rendering ── */
function cardHTML(a, isFeatured) {
  const isBn     = langMode === 'bn' && a.titleBn;
  const title    = highlight(isBn ? a.titleBn : (a.title || 'Untitled'), searchQuery);
  const desc     = highlight(isBn ? (a.descBn || '') : (a.desc || ''), searchQuery);
  const source   = escapeHTML(a.sourceName || 'Unknown');
  const link     = safeURL(a.link);
  const img      = safeURL(a.img);

  // Missing art gets the striped placeholder, captioned with what belongs there.
  const thumb = img
    ? '<div class="thumb"><img src="' + img + '" alt="" loading="lazy" decoding="async"'
      + ' onerror="this.parentNode.className=&quot;thumb placeholder&quot;;this.outerHTML=&quot;<span class=\\&quot;cap\\&quot;>Image unavailable</span>&quot;"></div>'
    : '<div class="thumb placeholder"><span class="cap">No image &#183; ' + source + '</span></div>';

  return '<a class="card' + (isFeatured ? ' featured' : '') + '" href="' + (link || '#') + '"'
    + (link ? ' target="_blank" rel="noopener noreferrer"' : '') + '>'
    + thumb
    + '<div class="card-body">'
    + (isFeatured ? '<span class="lead-badge">Lead story</span>' : '')
    + '<span class="label">' + source + '</span>'
    + '<h2 class="card-title"' + (isBn ? ' lang="bn"' : '') + '>' + title + '</h2>'
    + (desc ? '<p class="card-desc"' + (isBn ? ' lang="bn"' : '') + '>' + desc + '</p>' : '')
    + '<div class="card-meta"><span class="age">' + (timeAgo(a.pubDate) || '&#8212;') + '</span>'
    + '<span>Read &#8594;</span></div>'
    + '</div></a>';
}

function renderArticles() {
  const container = document.getElementById('feed-container');
  const q = searchQuery.toLowerCase();

  let articles = activeFilter === 'all'
    ? allArticles
    : allArticles.filter(a => a.sourceId === activeFilter);

  if (q) {
    articles = articles.filter(a =>
      (a.title || '').toLowerCase().includes(q) ||
      (a.desc  || '').toLowerCase().includes(q) ||
      (a.titleBn || '').toLowerCase().includes(q)
    );
  }

  document.getElementById('article-count').textContent =
    articles.length.toLocaleString() + (articles.length === 1 ? ' article' : ' articles');

  if (!articles.length) {
    visibleArticles = [];
    renderedCount = 0;
    if (feedObserver) feedObserver.disconnect();
    container.innerHTML = '<div class="notice"><h3>Nothing here yet</h3><p>'
      + (q ? 'No headlines match "' + escapeHTML(searchQuery) + '". Widen the term or clear the filter.'
           : 'This source has published nothing in the retained window. Pick another source or region.')
      + '</p></div>';
    return;
  }

  // Only a page of cards is put in the DOM at a time — a feed can hold
  // thousands of articles, and rendering them all makes every subsequent
  // repaint (theme switch, filtering, scrolling) crawl.
  visibleArticles = articles;
  featuredIndex   = (!q && activeFilter === 'all') ? articles.findIndex(a => a.img) : -1;
  renderedCount   = 0;

  container.innerHTML = '<div class="grid" id="feed-grid"></div>'
    + '<div id="feed-sentinel" class="feed-sentinel"><span class="label" id="feed-progress"></span></div>';
  appendBatch();
  observeSentinel();
}

function appendBatch() {
  const grid = document.getElementById('feed-grid');
  if (!grid || renderedCount >= visibleArticles.length) return;

  const slice = visibleArticles.slice(renderedCount, renderedCount + PAGE_SIZE);
  grid.insertAdjacentHTML('beforeend', slice.map((a, i) =>
    cardHTML(a, renderedCount + i === featuredIndex)).join(''));
  renderedCount += slice.length;

  const progress = document.getElementById('feed-progress');
  if (progress) progress.textContent = renderedCount + ' / ' + visibleArticles.length + ' shown';

  if (renderedCount >= visibleArticles.length) {
    const sentinel = document.getElementById('feed-sentinel');
    if (sentinel) sentinel.innerHTML = '<span class="label">End of feed &#183; ' + visibleArticles.length + ' shown</span>';
    if (feedObserver) feedObserver.disconnect();
  }
}

function observeSentinel() {
  if (feedObserver) feedObserver.disconnect();
  const sentinel = document.getElementById('feed-sentinel');
  if (!sentinel || renderedCount >= visibleArticles.length) return;

  feedObserver = new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting)) appendBatch();
  }, { rootMargin: '600px 0px' });
  feedObserver.observe(sentinel);
}

function showSkeletons() {
  const skel = '<div class="skeleton"><div class="skeleton-thumb"></div><div class="skeleton-body">'
    + '<div class="skeleton-line" style="width:35%"></div>'
    + '<div class="skeleton-line"></div>'
    + '<div class="skeleton-line" style="width:85%"></div>'
    + '<div class="skeleton-line" style="width:55%"></div>'
    + '</div></div>';
  document.getElementById('feed-container').innerHTML =
    '<div class="loading-grid">' + Array(6).fill(skel).join('') + '</div>';
}

function showPageSummary(text) {
  const box = document.getElementById('page-summary');
  if (!text) { box.style.display = 'none'; return; }
  const body = document.getElementById('page-summary-text');
  body.textContent = text;
  body.classList.add('clamped');
  const toggle = document.getElementById('summary-toggle');
  toggle.textContent = 'Read more';
  toggle.setAttribute('aria-expanded', 'false');
  box.style.display = 'block';
}

function toggleSummary() {
  const body = document.getElementById('page-summary-text');
  const toggle = document.getElementById('summary-toggle');
  const clamped = body.classList.toggle('clamped');
  toggle.textContent = clamped ? 'Read more' : 'Show less';
  toggle.setAttribute('aria-expanded', clamped ? 'false' : 'true');
}

function showHeadlines(articles) {
  const list = document.getElementById('headlines-list');
  if (!articles || !articles.length) { list.innerHTML = ''; return; }
  list.innerHTML = articles.slice(0, 6).map(a => {
    const link = safeURL(a.link);
    const isBn = langMode === 'bn' && a.titleBn;
    const text = escapeHTML(isBn ? a.titleBn : (a.title || ''));
    return '<li class="headline-item">'
      + '<a class="headline-title" href="' + (link || '#') + '"' + (isBn ? ' lang="bn"' : '')
      + (link ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + text + '</a>'
      + '<span class="headline-time">' + (timeAgo(a.pubDate) || '—') + '</span>'
      + '</li>';
  }).join('');
}

/* ── Data ── */
async function loadData() {
  if (loading) return;
  loading = true;

  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  document.getElementById('refresh-label').textContent = 'Fetching';
  setStatus('warn', 'Loading', 'Fetching ' + REGION_CONFIG[activeRegion].dataFile);
  showSkeletons();

  try {
    const base = window.location.pathname.replace(/[^/]*$/, '');
    const res  = await fetch(base + REGION_CONFIG[activeRegion].dataFile + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data  = await res.json();
    allArticles = (data.articles || []).map(a => ({
      ...a,
      title:   plainText(a.title),
      desc:    plainText(a.desc),
      titleBn: a.titleBn ? plainText(a.titleBn) : a.titleBn,
      descBn:  a.descBn  ? plainText(a.descBn)  : a.descBn
    }));
    allSources  = data.sources  || [];

    if (data.fetchedAt) {
      const fetched = new Date(data.fetchedAt);
      const stamp = fetched.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        + ' · ' + fetched.toLocaleDateString([], { day: '2-digit', month: 'short' });
      document.getElementById('last-updated').textContent = 'Fetched ' + stamp;
      document.getElementById('summary-provenance').textContent = stamp;
      document.getElementById('latest-provenance').textContent = stamp;
    }

    showHeadlines(allArticles);
    showPageSummary(data.summary);
    setStatus('ok', 'Live', REGION_CONFIG[activeRegion].label);
    buildFilterBar();
    renderArticles();

  } catch (e) {
    document.getElementById('feed-container').innerHTML =
      '<div class="notice error">'
      + '<h3>No data file</h3>'
      + '<p>' + escapeHTML(REGION_CONFIG[activeRegion].dataFile) + ' did not load: ' + escapeHTML(e.message) + '.</p>'
      + '<p>Run the Fetch RSS Feeds workflow in Actions, then reload.</p>'
      + '</div>';
    setStatus('err', 'Failed', 'No data file');
    document.getElementById('article-count').textContent = '';
  }

  btn.disabled = false;
  document.getElementById('refresh-label').textContent = 'Refresh';
  loading = false;
}

/* ── Back to top ── */
const toTop = document.getElementById('to-top');
window.addEventListener('scroll', () => {
  toTop.classList.toggle('show', window.scrollY > 600);
}, { passive: true });

/* ── Boot ── */
document.querySelectorAll('.tab').forEach(c => {
  c.setAttribute('aria-selected', c.dataset.region === activeRegion ? 'true' : 'false');
});
applyRegionChrome();
loadData();
</script>
</body>
</html>
