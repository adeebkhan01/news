<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="A clean, fast news reader for Bangladesh, Australia and the world — headlines from trusted sources, updated continuously." />
<meta name="theme-color" content="#146c42" />
<title>The Daily Digest — Bangladesh · Australia · Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@300;400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet" />
<script>
  (function () {
    var stored = localStorage.getItem('news-theme');
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* Broadsheet Green — page and card share one paper tone; borders and
   hairlines do the separating, as in print. */
:root{
  --bg:#faf7f1;--surface:#f2ece0;--card:#faf7f1;
  --border:#e2dbcd;--hairline:#e6dfd1;--border-strong:#cfc6b4;--input-border:#cfc6b4;
  --text:#1b1a17;--text-2:#4c463c;--muted:#6f6759;
  --brand:#146c42;--brand-2:#0f5533;--brand-dim:#e7efe9;--brand-ink:#faf7f1;
  --danger:#a8332b;--danger-dim:#f7ebe6;
  --mark:rgba(20,108,66,.18);
  --shadow-sm:0 1px 2px rgba(27,26,23,.05);
  --shadow:0 2px 6px rgba(27,26,23,.06),0 1px 2px rgba(27,26,23,.04);
  --shadow-lg:0 14px 34px -12px rgba(27,26,23,.20),0 3px 10px rgba(27,26,23,.06);
  --serif:'Libre Baskerville',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'Source Sans 3',system-ui,sans-serif;
  --bangla:'Tiro Bangla','Source Sans 3',serif;
  --r-sm:8px;--r:12px;--r-lg:18px;
  --header-h:60px;
}

:root[data-theme="dark"]{
  --bg:#16161a;--surface:#1c1c21;--card:#16161a;
  --border:#2a2a30;--hairline:#26262c;--border-strong:#3a3a42;--input-border:#3a3a42;
  --text:#efece4;--text-2:#c6c1b6;--muted:#a5a096;
  --brand:#3fa974;--brand-2:#5cc290;--brand-dim:#1b2b23;--brand-ink:#101014;
  --danger:#e08078;--danger-dim:#2a1e1c;
  --mark:rgba(63,169,116,.24);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 6px rgba(0,0,0,.35);
  --shadow-lg:0 16px 36px -14px rgba(0,0,0,.7),0 3px 10px rgba(0,0,0,.35);
}

html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;
  min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;
}
/* Colour transitions are suppressed while the theme swaps so the whole
   document doesn't animate hundreds of borders and shadows at once. */
:root.theme-switch *,:root.theme-switch *::before,:root.theme-switch *::after{
  transition:none!important;animation:none!important;
}
a{color:inherit}
[lang="bn"]{font-family:var(--bangla);line-height:1.6}
.card-title[lang="bn"],.headline-title[lang="bn"]{font-weight:400}
::selection{background:var(--mark)}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:4px}

.wrap{max-width:1320px;margin:0 auto;padding:0 1.5rem}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--brand);color:var(--brand-ink);padding:.6rem 1rem;border-radius:0 0 var(--r-sm) 0;z-index:300;font-size:.85rem}
.skip-link:focus{left:0}

/* ── Masthead ───────────────────────────────────────── */
.masthead{
  position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);
}
.masthead-inner{display:flex;align-items:center;gap:1rem;height:var(--header-h)}
.logo{
  font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--text);
  letter-spacing:-.025em;display:flex;align-items:center;gap:.55rem;text-decoration:none;flex-shrink:0;
}
.logo .mark{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--brand-2),var(--brand));color:var(--brand-ink);
  font-family:var(--sans);font-weight:700;font-size:.85rem;letter-spacing:-.02em;
  box-shadow:var(--shadow-sm);
}
.logo .edition{color:var(--muted);font-weight:600;font-size:.78rem;font-family:var(--sans);
  letter-spacing:.06em;text-transform:uppercase;padding-left:.6rem;margin-left:.1rem;
  border-left:1px solid var(--border-strong)}

.masthead-right{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.last-updated{font-size:.75rem;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.btn{
  font-family:var(--sans);font-size:.8rem;font-weight:500;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  border:1px solid var(--border-strong);background:var(--card);color:var(--text-2);
  padding:.4rem .8rem;transition:border-color .15s,background .15s,color .15s,transform .1s;
}
.btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-dim)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-2);border-color:var(--brand-2);color:var(--brand-ink)}
.btn-icon{width:34px;height:34px;padding:0;border-radius:50%}
#refresh-btn.spinning svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#lang-toggle.bn{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
:root[data-theme="dark"] .i-moon,:root:not([data-theme="dark"]) .i-sun{display:none}

/* ── Toolbar: region + search ───────────────────────── */
.toolbar{border-bottom:1px solid var(--border);background:var(--surface)}
.toolbar-inner{display:flex;align-items:center;gap:1rem;padding:.7rem 0;flex-wrap:wrap}
.segmented{
  display:inline-flex;gap:.15rem;padding:.2rem;border-radius:999px;
  background:var(--bg);border:1px solid var(--border);flex-shrink:0;
}
.region-chip{
  font-family:var(--sans);font-size:.8rem;font-weight:500;padding:.35rem .95rem;border-radius:999px;
  border:none;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;
  transition:color .15s,background .15s;
}
.region-chip:hover{color:var(--text)}
.region-chip.active{background:var(--brand);color:var(--brand-ink);font-weight:600;box-shadow:var(--shadow-sm)}

.search{position:relative;flex:1;min-width:220px}
.search > svg{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#search-input{
  width:100%;background:var(--card);border:1px solid var(--input-border);border-radius:999px;
  padding:.5rem 4.6rem .5rem 2.5rem;font-family:var(--sans);font-size:.86rem;color:var(--text);
  outline:none;transition:border-color .15s,box-shadow .15s;
}
#search-input::placeholder{color:var(--muted)}
#search-input::-webkit-search-cancel-button{display:none}
#search-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-dim)}
.kbd-hint{
  position:absolute;right:.65rem;top:50%;transform:translateY(-50%);pointer-events:none;
  font-family:var(--mono);font-size:.65rem;color:var(--muted);border:1px solid var(--border);
  border-radius:5px;padding:.1rem .35rem;background:var(--surface);
}
#search-clear{
  position:absolute;right:.55rem;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--muted);cursor:pointer;font-size:.95rem;display:none;line-height:1;padding:.25rem .3rem;border-radius:50%;
}
#search-clear:hover{color:var(--text);background:var(--surface)}

/* ── Source chips ───────────────────────────────────── */
.filter-bar{border-bottom:1px solid var(--border);background:var(--bg);position:relative}
.filter-bar::after{
  content:'';position:absolute;right:0;top:0;bottom:0;width:44px;pointer-events:none;
  background:linear-gradient(to right,transparent,var(--bg));
}
.filter-bar-inner{display:flex;gap:.4rem;padding:.6rem 0;overflow-x:auto;scrollbar-width:none}
.filter-bar-inner::-webkit-scrollbar{display:none}
.chip{
  font-family:var(--sans);font-size:.76rem;font-weight:500;padding:.32rem .8rem;border-radius:999px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;
  white-space:nowrap;transition:all .15s;flex-shrink:0;display:inline-flex;align-items:center;gap:.4rem;
}
.chip:hover{border-color:var(--brand);color:var(--text)}
.chip.active{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.chip .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.chip .count{font-family:var(--mono);font-size:.72rem;font-variant-numeric:tabular-nums;opacity:.7}

/* ── Layout ─────────────────────────────────────────── */
.content-wrap{
  max-width:1320px;margin:0 auto;padding:1.6rem 1.5rem 2rem;
  display:grid;grid-template-columns:1fr 264px;gap:2rem;align-items:start;
}
.main-col{min-width:0}

.status-bar{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  margin-bottom:1.1rem;font-size:.8rem;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--brand-2);display:inline-block;margin-right:.45rem;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}

/* ── Briefing ───────────────────────────────────────── */
.page-summary{
  position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:1.15rem 1.35rem 1.2rem;margin-bottom:1.4rem;box-shadow:var(--shadow);overflow:hidden;
}
.page-summary::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--brand-2),var(--brand))}
.page-summary-label{
  font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--brand);
  margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem;
}
#page-summary-text{font-size:.92rem;line-height:1.75;color:var(--text-2)}
#summary-toggle{
  display:none;margin-top:.65rem;font-family:var(--sans);font-size:.76rem;font-weight:600;
  background:none;border:none;color:var(--brand);cursor:pointer;padding:0;
}
@media(max-width:700px){
  #summary-toggle{display:inline-block}
  #page-summary-text.clamped{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
}

/* ── Cards ──────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.15rem}
.card{
  position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;
  box-shadow:var(--shadow-sm);
  transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s,border-color .22s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
.grid > .card{content-visibility:auto;contain-intrinsic-size:auto 340px}
.grid > .card.featured{content-visibility:visible}
.thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--surface);flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
.thumb img.loaded{opacity:1}
.card:hover .thumb img{transform:scale(1.045)}
.thumb.placeholder{display:grid;place-items:center}
.thumb.placeholder .monogram{
  font-family:var(--serif);font-size:2rem;font-weight:700;opacity:.5;letter-spacing:.02em;
}

.card-body{padding:1rem 1.1rem 1.05rem;flex:1;display:flex;flex-direction:column}
.card-source{
  font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  margin-bottom:.55rem;display:flex;align-items:center;gap:.4rem;
}
.card-source::before{
  content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--src,var(--muted));
}
.card-title{
  font-family:var(--serif);font-size:1rem;font-weight:700;line-height:1.42;color:var(--text);
  margin-bottom:.5rem;letter-spacing:-.005em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.card:hover .card-title{color:var(--brand)}
.card-desc{
  font-size:.83rem;color:var(--muted);line-height:1.6;margin-bottom:.85rem;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-meta{
  font-size:.74rem;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:space-between;margin-top:auto;
  padding-top:.7rem;border-top:1px solid var(--hairline);
}
.card-meta::after{content:'Read →';transition:color .15s,transform .2s}
.card:hover .card-meta::after{color:var(--brand);transform:translateX(2px)}

/* Featured */
.card.featured{grid-column:1/-1;flex-direction:row;align-items:stretch}
.card.featured .thumb{width:52%;min-width:0;aspect-ratio:auto;height:auto;min-height:280px}
.card.featured .card-body{padding:1.75rem 1.9rem;justify-content:center}
.card.featured .card-title{font-size:1.6rem;line-height:1.28;-webkit-line-clamp:4;margin-bottom:.7rem}
.card.featured .card-desc{font-size:.92rem;-webkit-line-clamp:3}
.lead-badge{
  display:inline-flex;align-items:center;gap:.35rem;align-self:flex-start;margin-bottom:.75rem;
  font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:var(--brand-dim);color:var(--brand);padding:.28rem .6rem;border-radius:999px;
}
@media(max-width:820px){
  .card.featured{flex-direction:column}
  .card.featured .thumb{width:100%;aspect-ratio:16/9;min-height:0}
  .card.featured .card-body{padding:1.25rem}
  .card.featured .card-title{font-size:1.25rem}
}
.highlight{background:var(--mark);border-radius:3px;padding:0 2px;color:inherit}

.feed-sentinel{display:flex;justify-content:center;padding:1.75rem 0 .5rem}
.feed-more,.feed-end{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.feed-more::before{
  content:'';width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:-1px;
  margin-right:.5rem;border:2px solid var(--border-strong);border-top-color:var(--brand);
  animation:spin .8s linear infinite;
}

/* ── Sidebar ────────────────────────────────────────── */
.sidebar{
  position:sticky;top:calc(var(--header-h) + 1rem);display:flex;flex-direction:column;gap:1.25rem;
  max-height:calc(100vh - var(--header-h) - 2rem);overflow-y:auto;overscroll-behavior:contain;
  padding-right:.4rem;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-track{background:transparent}
.sidebar::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px}
.sidebar::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem 1.15rem;box-shadow:var(--shadow-sm)}
.panel-label{
  font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--brand);
  margin-bottom:.85rem;display:flex;align-items:center;gap:.45rem;
}
.headlines-list{list-style:none;display:flex;flex-direction:column;counter-reset:hl}
.headline-item{
  padding:.7rem 0;border-bottom:1px solid var(--hairline);
  display:grid;grid-template-columns:auto 1fr;column-gap:.7rem;align-items:start;
}
.headline-item:first-child{padding-top:0}
.headline-item:last-child{border-bottom:none;padding-bottom:0}
.headline-item::before{
  counter-increment:hl;content:counter(hl,decimal-leading-zero);grid-row:1/3;
  font-family:var(--mono);font-size:.7rem;color:var(--brand);opacity:.6;padding-top:.1rem;
}
.headline-title{
  font-family:var(--serif);font-size:.8rem;font-weight:700;color:var(--text);line-height:1.45;
  text-decoration:none;display:block;margin-bottom:.2rem;transition:color .15s;
}
.headline-title:hover{color:var(--brand)}
.headline-time{display:block;font-size:.72rem;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── Skeletons ──────────────────────────────────────── */
.loading-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.15rem}
.skeleton{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.sk{
  background:linear-gradient(90deg,var(--surface) 25%,var(--bg) 37%,var(--surface) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite;
}
:root[data-theme="dark"] .sk{background:linear-gradient(90deg,var(--surface) 25%,var(--border) 37%,var(--surface) 63%);background-size:400% 100%}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skeleton-thumb{aspect-ratio:16/9}
.skeleton-body{padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.55rem}
.skeleton-line{height:11px;border-radius:5px}

/* ── States ─────────────────────────────────────────── */
.error-box{
  background:var(--danger-dim);border:1px solid var(--danger);border-radius:var(--r-lg);
  padding:2rem 1.5rem;color:var(--text);margin:1rem 0;text-align:center;
}
.error-box h3{font-family:var(--serif);font-weight:700;margin-bottom:.5rem;font-size:1.15rem;color:var(--danger)}
.error-box p{font-size:.87rem;line-height:1.7;color:var(--text-2);max-width:52ch;margin:0 auto}
.empty{text-align:center;padding:4.5rem 1rem;color:var(--muted)}
.empty svg{opacity:.35;margin-bottom:1rem}
.empty h3{font-family:var(--serif);font-weight:700;color:var(--text);font-size:1.2rem;margin-bottom:.4rem}
.empty p{font-size:.87rem}

footer{
  margin-top:2.5rem;padding:2rem 1.5rem;text-align:center;font-size:.76rem;color:var(--muted);
  border-top:1px solid var(--border);background:var(--surface);
}
footer .foot-links{display:flex;gap:1rem;justify-content:center;margin-top:.6rem;flex-wrap:wrap}
footer a{color:var(--brand);text-decoration:none}
footer a:hover{text-decoration:underline}

#to-top{
  position:fixed;right:1.5rem;bottom:1.5rem;width:42px;height:42px;border-radius:50%;z-index:90;
  border:1px solid var(--border-strong);background:var(--card);color:var(--text-2);cursor:pointer;
  display:grid;place-items:center;box-shadow:var(--shadow-lg);
  opacity:0;visibility:hidden;transform:translateY(10px);transition:all .2s;
}
#to-top.show{opacity:1;visibility:visible;transform:none}
#to-top:hover{color:var(--brand);border-color:var(--brand)}

/* ── Responsive ─────────────────────────────────────── */
@media(max-width:980px){
  .content-wrap{grid-template-columns:1fr;gap:1.5rem}
  .sidebar{position:static;flex-direction:row;flex-wrap:wrap;max-height:none;overflow:visible;padding-right:0}
  .sidebar .panel{flex:1;min-width:260px}
}
@media(max-width:700px){
  .wrap,.content-wrap{padding-left:1rem;padding-right:1rem}
  .logo .edition{display:none}
  .kbd-hint{display:none}
  .grid,.loading-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .masthead-inner{height:auto;padding:.6rem 0;flex-wrap:wrap;gap:.6rem}
  .nav-links{order:3;width:100%;margin-left:0}
  .last-updated{display:none}
  .toolbar-inner{gap:.6rem}
  .segmented{width:100%;justify-content:space-between}
  .region-chip{flex:1;padding:.35rem .5rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<a class="skip-link" href="#feed-container">Skip to headlines</a>

<header class="masthead">
  <div class="masthead-inner wrap">
    <a class="logo" href="index.html" id="logo">
      <span class="mark" id="logo-mark">BD</span>
      <span id="logo-text">The Daily Digest</span>
      <span class="edition" id="logo-edition">Bangladesh</span>
    </a>
    <div class="masthead-right">
      <span class="last-updated" id="last-updated">—</span>
      <button class="btn btn-icon" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path class="i-moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          <g class="i-sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M3.6 3.6l1.4 1.4M19 19l1.4 1.4M1.5 12h2M20.5 12h2M3.6 20.4L5 19M19 5l1.4-1.4"/></g>
        </svg>
      </button>
      <button class="btn" id="lang-toggle" onclick="toggleLang()" aria-label="Switch language" lang="bn">বাংলা</button>
      <button class="btn btn-primary" id="refresh-btn" onclick="loadData()" aria-label="Refresh headlines">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span class="btn-label">Refresh</span>
      </button>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner wrap">
    <div class="segmented" id="region-bar" role="tablist" aria-label="Region">
      <button class="region-chip active" role="tab" aria-selected="true" data-region="bd" onclick="switchRegion('bd',this)">Bangladesh</button>
      <button class="region-chip" role="tab" aria-selected="false" data-region="au" onclick="switchRegion('au',this)">Australia</button>
      <button class="region-chip" role="tab" aria-selected="false" data-region="global" onclick="switchRegion('global',this)">Global</button>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search-input" type="search" autocomplete="off" placeholder="Search headlines…" aria-label="Search headlines" oninput="onSearch(this.value)" />
      <span class="kbd-hint" id="kbd-hint">/</span>
      <button id="search-clear" onclick="clearSearch()" aria-label="Clear search">✕</button>
    </div>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-bar-inner wrap" id="filter-bar" role="group" aria-label="Filter by source">
    <button class="chip active" onclick="setFilter('all',this)">All Sources</button>
  </div>
</div>

<main class="content-wrap">
  <div class="main-col">
    <section id="page-summary" style="display:none" class="page-summary" aria-label="AI briefing">
      <div class="page-summary-label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5 9.8 12.2 3.5 10l6.3-1.7z"/></svg>
        Today's Briefing
      </div>
      <div id="page-summary-text"></div>
      <button id="summary-toggle" onclick="toggleSummary()" aria-expanded="false">Read more</button>
    </section>
    <div class="status-bar">
      <span><span class="status-dot"></span><span id="status-text">Loading…</span></span>
      <span id="article-count"></span>
    </div>
    <div id="feed-container"></div>
  </div>

  <aside class="sidebar">
    <div class="panel">
      <div class="panel-label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Latest
      </div>
      <ul class="headlines-list" id="headlines-list"></ul>
    </div>
  </aside>
</main>

<button id="to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<footer>
  <div>The Daily Digest · Headlines from Bangladesh, Australia &amp; the world</div>
  <div class="foot-links">
    <span>Refreshed automatically via GitHub Actions</span>
  </div>
</footer>

<script>
let allArticles  = [];
let allSources   = [];
let activeFilter = 'all';
let searchQuery  = '';
let loading      = false;
let langMode     = 'en';
let activeRegion = localStorage.getItem('news-region') || 'bd';
let searchTimer  = null;

const PAGE_SIZE = 24;
let visibleArticles = [];
let renderedCount   = 0;
let featuredIndex   = -1;
let feedObserver    = null;

const REGION_CONFIG = {
  bd:     { label: 'Bangladesh', mark: 'BD', dataFile: 'data-bd.json',     hasLang: true  },
  au:     { label: 'Australia',  mark: 'AU', dataFile: 'data-au.json',     hasLang: false },
  global: { label: 'Global',     mark: 'GL', dataFile: 'data-global.json', hasLang: false }
};

/* ── Theme ── */
function toggleTheme() {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';

  // Attribute flip only: the icon swap is CSS, and the storage write is a
  // synchronous disk hit that has no business in front of the repaint.
  root.classList.add('theme-switch');
  root.setAttribute('data-theme', next);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.classList.remove('theme-switch');
    localStorage.setItem('news-theme', next);
  }));
}

/* ── Helpers ── */
function escapeHTML(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]
  );
}

// Older data files were written before the feed parser learned to decode
// entities before stripping, so they still carry <p>, <br> and href URLs in
// the copy. Clean it at render time too, rather than waiting on a refetch.
function decodeEntities(str) {
  return str
    .replace(/&#(\d+);/g, (_, d) => String.fromCharCode(+d))
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/&nbsp;/g, ' ').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&amp;/g, '&');
}

function plainText(str) {
  let s = String(str == null ? '' : str);
  for (let i = 0; i < 3; i++) {
    const next = decodeEntities(s).replace(/<[^>]*>/g, ' ')
      .replace(/<[^>]*$/, ' ');   // descriptions get truncated mid-tag
    if (next === s) break;
    s = next;
  }
  return s.replace(/\s+/g, ' ').trim();
}

function safeURL(url) {
  const raw = String(url || '').trim();
  return /^https?:\/\//i.test(raw) ? escapeHTML(raw) : '';
}

function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp('(' + escaped + ')', 'gi'), '<span class="highlight">$1</span>');
}

function timeAgo(dateStr) {
  const t = Date.parse(dateStr);
  if (!t) return '';
  const diff = (Date.now() - t) / 1000;
  if (diff < 60)    return 'just now';
  if (diff < 3600)  return Math.floor(diff / 60)    + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600)  + 'h ago';
  return                   Math.floor(diff / 86400) + 'd ago';
}

function monogram(name) {
  return String(name || '?').replace(/[^A-Za-zঀ-৿ ]/g, '').trim().split(/\s+/).slice(0, 2)
    .map(w => w[0] || '').join('').toUpperCase() || '·';
}

/* ── Language ── */
function toggleLang() {
  langMode = langMode === 'en' ? 'bn' : 'en';
  const btn = document.getElementById('lang-toggle');
  btn.textContent = langMode === 'bn' ? 'English' : 'বাংলা';
  btn.setAttribute('lang', langMode === 'bn' ? 'en' : 'bn');
  btn.classList.toggle('bn', langMode === 'bn');
  renderArticles();
  showHeadlines(allArticles);
}

/* ── Region ── */
function switchRegion(regionId, el) {
  if (regionId === activeRegion) return;
  activeRegion = regionId;
  localStorage.setItem('news-region', regionId);
  applyRegionChrome();

  document.querySelectorAll('.region-chip').forEach(c => {
    const on = c === el;
    c.classList.toggle('active', on);
    c.setAttribute('aria-selected', on ? 'true' : 'false');
  });

  activeFilter = 'all';
  clearSearch();
  loadData();
}

function applyRegionChrome() {
  const cfg = REGION_CONFIG[activeRegion];
  document.getElementById('logo-mark').textContent = cfg.mark;
  document.getElementById('logo-edition').textContent = cfg.label;
  document.title = 'The Daily Digest — ' + cfg.label;

  const langBtn = document.getElementById('lang-toggle');
  langBtn.style.display = cfg.hasLang ? '' : 'none';
  if (!cfg.hasLang && langMode !== 'en') {
    langMode = 'en';
    langBtn.textContent = 'বাংলা';
    langBtn.setAttribute('lang', 'bn');
    langBtn.classList.remove('bn');
  }
}

/* ── Search ── */
function onSearch(val) {
  document.getElementById('search-clear').style.display = val ? 'block' : 'none';
  document.getElementById('kbd-hint').style.display = val ? 'none' : '';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = val.trim();
    renderArticles();
  }, 140);
}

function clearSearch() {
  searchQuery = '';
  const input = document.getElementById('search-input');
  input.value = '';
  document.getElementById('search-clear').style.display = 'none';
  document.getElementById('kbd-hint').style.display = '';
  renderArticles();
}

document.addEventListener('keydown', e => {
  const input = document.getElementById('search-input');
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); input.focus(); input.select(); }
  if (e.key === 'Escape' && document.activeElement === input) { clearSearch(); input.blur(); }
});

/* ── Filters ── */
function buildFilterBar() {
  const counts = {};
  allArticles.forEach(a => { counts[a.sourceId] = (counts[a.sourceId] || 0) + 1; });

  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'chip' + (activeFilter === 'all' ? ' active' : '');
  allBtn.textContent = 'All Sources';
  allBtn.onclick = () => setFilter('all', allBtn);
  bar.appendChild(allBtn);

  allSources.forEach(s => {
    const count = counts[s.id] || 0;
    if (!count) return;
    const btn = document.createElement('button');
    btn.className = 'chip' + (activeFilter === s.id ? ' active' : '');
    btn.innerHTML = '<span class="dot" style="background:' + escapeHTML(s.color || '#999') + '"></span>'
      + escapeHTML(s.name) + '<span class="count">' + count + '</span>';
    btn.onclick = () => setFilter(s.id, btn);
    bar.appendChild(btn);
  });
}

function setFilter(id, el) {
  activeFilter = id;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderArticles();
}

/* ── Rendering ── */
function cardHTML(a, isFeatured) {
  const isBn     = langMode === 'bn' && a.titleBn;
  const title    = highlight(escapeHTML(isBn ? a.titleBn : (a.title || 'Untitled')), escapeHTML(searchQuery));
  const desc     = highlight(escapeHTML(isBn ? (a.descBn || '') : (a.desc || '')), escapeHTML(searchQuery));
  const source   = escapeHTML(a.sourceName || 'Unknown');
  const color    = escapeHTML(a.sourceColor || '#8a8578');
  const link     = safeURL(a.link);
  const img      = safeURL(a.img);

  const thumb = img
    ? '<div class="thumb"><img src="' + img + '" alt="" loading="lazy" decoding="async"'
      + ' onload="this.classList.add(\'loaded\')"'
      + ' onerror="this.closest(\'.thumb\').outerHTML=&quot;&quot;"></div>'
    : '<div class="thumb placeholder" style="background:linear-gradient(135deg,' + color + '1f,' + color + '08)" aria-hidden="true">'
      + '<span class="monogram" style="color:' + color + '">' + escapeHTML(monogram(a.sourceName)) + '</span></div>';

  return '<a class="card' + (isFeatured ? ' featured' : '') + '" href="' + (link || '#') + '"'
    + (link ? ' target="_blank" rel="noopener noreferrer"' : '') + '>'
    + thumb
    + '<div class="card-body">'
    + (isFeatured ? '<span class="lead-badge">Lead story</span>' : '')
    + '<div class="card-source" style="--src:' + color + ';color:' + color + '">' + source + '</div>'
    + '<h2 class="card-title"' + (isBn ? ' lang="bn"' : '') + '>' + title + '</h2>'
    + (desc ? '<p class="card-desc"' + (isBn ? ' lang="bn"' : '') + '>' + desc + '</p>' : '')
    + '<div class="card-meta"><span>' + (timeAgo(a.pubDate) || '—') + '</span></div>'
    + '</div></a>';
}

function renderArticles() {
  const container = document.getElementById('feed-container');
  const q = searchQuery.toLowerCase();

  let articles = activeFilter === 'all'
    ? allArticles
    : allArticles.filter(a => a.sourceId === activeFilter);

  if (q) {
    articles = articles.filter(a =>
      (a.title || '').toLowerCase().includes(q) ||
      (a.desc  || '').toLowerCase().includes(q) ||
      (a.titleBn || '').toLowerCase().includes(q)
    );
  }

  document.getElementById('article-count').textContent =
    articles.length + (articles.length === 1 ? ' article' : ' articles');

  if (!articles.length) {
    visibleArticles = [];
    renderedCount = 0;
    if (feedObserver) feedObserver.disconnect();
    container.innerHTML = '<div class="empty">'
      + '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'
      + '<h3>Nothing here yet</h3><p>'
      + (q ? 'No headlines match “' + escapeHTML(searchQuery) + '”. Try a broader term.' : 'Try another source or region.')
      + '</p></div>';
    return;
  }

  // Only a page of cards is put in the DOM at a time — a feed can hold
  // thousands of articles, and rendering them all makes every subsequent
  // repaint (theme switch, filtering, scrolling) crawl.
  visibleArticles = articles;
  featuredIndex   = (!q && activeFilter === 'all') ? articles.findIndex(a => a.img) : -1;
  renderedCount   = 0;

  container.innerHTML = '<div class="grid" id="feed-grid"></div>'
    + '<div id="feed-sentinel" class="feed-sentinel"><span class="feed-more">Loading more…</span></div>';
  appendBatch();
  observeSentinel();
}

function appendBatch() {
  const grid = document.getElementById('feed-grid');
  if (!grid || renderedCount >= visibleArticles.length) return;

  const slice = visibleArticles.slice(renderedCount, renderedCount + PAGE_SIZE);
  grid.insertAdjacentHTML('beforeend', slice.map((a, i) =>
    cardHTML(a, renderedCount + i === featuredIndex)).join(''));
  renderedCount += slice.length;

  if (renderedCount >= visibleArticles.length) {
    const sentinel = document.getElementById('feed-sentinel');
    if (sentinel) sentinel.innerHTML = '<span class="feed-end">You’re all caught up</span>';
    if (feedObserver) feedObserver.disconnect();
  }
}

function observeSentinel() {
  if (feedObserver) feedObserver.disconnect();
  const sentinel = document.getElementById('feed-sentinel');
  if (!sentinel || renderedCount >= visibleArticles.length) return;

  feedObserver = new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting)) appendBatch();
  }, { rootMargin: '600px 0px' });
  feedObserver.observe(sentinel);
}

function showSkeletons() {
  const skel = '<div class="skeleton"><div class="skeleton-thumb sk"></div><div class="skeleton-body">'
    + '<div class="skeleton-line sk" style="width:35%"></div>'
    + '<div class="skeleton-line sk"></div>'
    + '<div class="skeleton-line sk" style="width:85%"></div>'
    + '<div class="skeleton-line sk" style="width:55%"></div>'
    + '</div></div>';
  document.getElementById('feed-container').innerHTML =
    '<div class="loading-grid">' + Array(6).fill(skel).join('') + '</div>';
}

function showPageSummary(text) {
  const box = document.getElementById('page-summary');
  if (!text) { box.style.display = 'none'; return; }
  const body = document.getElementById('page-summary-text');
  body.textContent = text;
  body.classList.add('clamped');
  const toggle = document.getElementById('summary-toggle');
  toggle.textContent = 'Read more';
  toggle.setAttribute('aria-expanded', 'false');
  box.style.display = 'block';
}

function toggleSummary() {
  const body = document.getElementById('page-summary-text');
  const toggle = document.getElementById('summary-toggle');
  const clamped = body.classList.toggle('clamped');
  toggle.textContent = clamped ? 'Read more' : 'Show less';
  toggle.setAttribute('aria-expanded', clamped ? 'false' : 'true');
}

function showHeadlines(articles) {
  const list = document.getElementById('headlines-list');
  if (!articles || !articles.length) { list.innerHTML = ''; return; }
  list.innerHTML = articles.slice(0, 6).map(a => {
    const link = safeURL(a.link);
    const isBn = langMode === 'bn' && a.titleBn;
    const text = escapeHTML(isBn ? a.titleBn : (a.title || ''));
    return '<li class="headline-item">'
      + '<a class="headline-title" href="' + (link || '#') + '"' + (isBn ? ' lang="bn"' : '')
      + (link ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + text + '</a>'
      + '<span class="headline-time">' + (timeAgo(a.pubDate) || '—') + '</span>'
      + '</li>';
  }).join('');
}

/* ── Data ── */
async function loadData() {
  if (loading) return;
  loading = true;

  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  document.getElementById('status-text').textContent = 'Loading…';
  showSkeletons();

  try {
    const base = window.location.pathname.replace(/[^/]*$/, '');
    const res  = await fetch(base + REGION_CONFIG[activeRegion].dataFile + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data  = await res.json();
    allArticles = (data.articles || []).map(a => ({
      ...a,
      title:   plainText(a.title),
      desc:    plainText(a.desc),
      titleBn: a.titleBn ? plainText(a.titleBn) : a.titleBn,
      descBn:  a.descBn  ? plainText(a.descBn)  : a.descBn
    }));
    allSources  = data.sources  || [];

    if (data.fetchedAt) {
      const fetched = new Date(data.fetchedAt);
      document.getElementById('last-updated').textContent =
        'Updated ' + fetched.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    showHeadlines(allArticles);
    showPageSummary(data.summary);
    document.getElementById('status-text').textContent =
      'Live · ' + REGION_CONFIG[activeRegion].label;
    buildFilterBar();
    renderArticles();

  } catch (e) {
    document.getElementById('feed-container').innerHTML =
      '<div class="error-box">'
      + '<h3>Waiting for the first data fetch</h3>'
      + '<p>Open this repository on GitHub → <strong>Actions</strong> → <strong>Fetch RSS Feeds</strong> → <strong>Run workflow</strong>. Once it finishes, refresh this page.</p>'
      + '<p style="margin-top:.6rem;font-size:.75rem;opacity:.65">Error: ' + escapeHTML(e.message) + '</p>'
      + '</div>';
    document.getElementById('status-text').textContent = 'No data yet';
    document.getElementById('article-count').textContent = '';
  }

  btn.classList.remove('spinning');
  loading = false;
}

/* ── Back to top ── */
const toTop = document.getElementById('to-top');
window.addEventListener('scroll', () => {
  toTop.classList.toggle('show', window.scrollY > 600);
}, { passive: true });

/* ── Boot ── */
document.querySelectorAll('.region-chip').forEach(c => {
  const on = c.dataset.region === activeRegion;
  c.classList.toggle('active', on);
  c.setAttribute('aria-selected', on ? 'true' : 'false');
});
applyRegionChrome();
loadData();
</script>
</body>
</html>
