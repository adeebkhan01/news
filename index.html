<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Nothing on this page may run, load or connect unless it is named here.
     script-src is 'self' plus one hash: the page's own files (which now
     includes vendor/sql-wasm-*.js, the vendored WebAssembly build of
     SQLite the archive reads its database through), and the inline theme
     bootstrap that has to run before first paint to avoid a flash.
     'wasm-unsafe-eval' is the one narrow exception to no 'unsafe-eval':
     WebAssembly.instantiate needs it, and it grants nothing eval or
     new Function would — sql.js does not call either, which
     tests/frontend.test.js checks for the whole vendor file, not just
     app.js. No 'unsafe-inline' on scripts or styles, so an injected tag
     cannot execute even if one ever got through — and nothing does, because
     feed text reaches the DOM as text nodes rather than as markup.
     img-src names the publishers' CDNs one by one, mirroring IMAGE_DOMAINS
     and IMAGE_HOSTS in lib/security.js — a domain wildcarded because the
     publisher owns it, a shared-CDN host named exactly because it does not.
     tests/security.test.js fails if the two drift apart. connect-src 'self'
     is also what lets the page fetch its own data-{region}.sqlite files.
     frame-ancestors is omitted deliberately: it is ignored in a meta CSP
     and needs a real header, which GitHub Pages will not serve. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-fZ21OHFTlZGA1hOkTvMIcS92235qeNGBK+384Rw3HMo='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://npr.brightspotcdn.com https://abc-cdn.net.au https://*.abc-cdn.net.au https://abc.net.au https://*.abc.net.au https://aljazeera.com https://*.aljazeera.com https://bbc.co.uk https://*.bbc.co.uk https://bbc.com https://*.bbc.com https://bbci.co.uk https://*.bbci.co.uk https://dailyamardesh.com https://*.dailyamardesh.com https://dw.com https://*.dw.com https://ffx.io https://*.ffx.io https://france24.com https://*.france24.com https://guim.co.uk https://*.guim.co.uk https://npr.org https://*.npr.org https://prothomalo.com https://*.prothomalo.com https://risingbd.com https://*.risingbd.com https://smh.com.au https://*.smh.com.au https://theconversation.com https://*.theconversation.com https://thedailystar.net https://*.thedailystar.net https://theguardian.com https://*.theguardian.com; connect-src 'self'; base-uri 'none'; form-action 'none'" />
<meta name="description" content="A clean, fast news reader for Bangladesh, Australia and the world — headlines from trusted sources, updated continuously." />
<meta name="theme-color" content="#fdfcfb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
<title>Daily Digest — Bangladesh · Australia · Global</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fdfcfb'/%3E%3Crect x='4' y='7' width='16' height='18' fill='%230e1729'/%3E%3Crect x='23' y='7' width='5' height='18' fill='%23d4a418'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Tiro+Bangla&display=swap" rel="stylesheet" />
<script>
  (function () {
    var stored = localStorage.getItem('news-theme');
    if (stored === 'dark') stored = 'night';          // migrate the old value
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="app.css?v=251872a4423c" />
</head>
<body>
<a class="skip-link" href="#feed-container" data-i18n="skipToHeadlines">Skip to headlines</a>

<header class="masthead">
  <div class="masthead-inner wrap">
    <a class="wordmark" href="index.html">
      <span>Daily Digest</span><span class="tick" aria-hidden="true"></span>
    </a>
    <!-- Navigation, not content: three regions inline, the active one named
         in full and the other two named only by flag once space is tight.
         This used to be its own bordered section under the masthead with a
         "Region" micro-label over it — chrome enough to read as a second
         piece of content rather than as wayfinding. -->
    <nav class="region-strip" id="region-strip" aria-label="Region" data-i18n-label="region">
      <button class="region-link" role="tab" aria-selected="true" data-region="bd"><span class="flag" aria-hidden="true">🇧🇩</span><span class="region-name" data-i18n="regionBd">Bangladesh</span></button>
      <span class="region-sep" aria-hidden="true">·</span>
      <button class="region-link" role="tab" aria-selected="false" data-region="au"><span class="flag" aria-hidden="true">🇦🇺</span><span class="region-name" data-i18n="regionAu">Australia</span></button>
      <span class="region-sep" aria-hidden="true">·</span>
      <button class="region-link" role="tab" aria-selected="false" data-region="global"><span class="flag" aria-hidden="true">🌏</span><span class="region-name" data-i18n="regionGlobal">Global</span></button>
    </nav>
    <div class="masthead-right">
      <span class="provenance" id="last-updated">—</span>
      <button class="btn" id="theme-toggle">
        <span id="theme-label">Night</span>
      </button>
      <button class="btn" id="lang-toggle" data-i18n-label="switchLanguage" aria-label="Switch language" lang="bn">বাংলা</button>
      <button class="btn btn-primary" id="refresh-btn">
        <span id="refresh-label">Refresh</span>
      </button>
    </div>
  </div>
</header>

<!-- Search and the source filter are utility, not editorial content — one
     quiet row, not two bordered sections competing with the briefing below
     for the reader's first glance. The source list itself is a dropdown
     now rather than an always-open row of chips: closed, it costs one line;
     open, it is the same list of sources it always was. -->
<div class="filter-row">
  <div class="filter-row-inner wrap">
    <div class="search-compact">
      <input id="search-input" type="search" autocomplete="off" placeholder="Search" data-i18n-placeholder="filterHeadlines" aria-label="Search" data-i18n-label="search" />
      <span class="kbd-hint" id="kbd-hint">/</span>
      <button id="search-clear" data-i18n-label="clearSearch" aria-label="Clear search">&#10005;</button>
    </div>
    <div class="sources-dropdown">
      <button id="sources-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span id="sources-trigger-label" data-i18n="allSources">All sources</span><span class="caret" aria-hidden="true">&#9662;</span>
      </button>
      <div class="sources-menu" id="sources-menu" role="listbox" data-i18n-label="filterBySource" aria-label="Filter by source" hidden>
        <button class="source-option active" role="option" aria-selected="true" data-source="all" data-i18n="allSources">All sources</button>
      </div>
    </div>
  </div>
</div>

<main class="content-wrap">
  <div class="main-col">
    <section id="page-summary" hidden aria-label="Top stories">
      <div class="section-head">
        <h2 data-i18n="orderTop">Top stories</h2>
        <span class="label brief-byline" id="brief-byline" hidden></span>
        <!-- Three buttons shrunk to one control: a date flanked by two
             arrows. The date itself is the "back to today" action, doing
             what a separate Today button did, so the reader is never
             shown three equal-weight buttons to understand one thing —
             where in time they are. -->
        <div class="archive-nav" id="archive-nav" hidden>
          <button id="archive-older" type="button" aria-label="Older">&#8249;</button>
          <button id="archive-date" type="button"></button>
          <button id="archive-newer" type="button" aria-label="Newer">&#8250;</button>
        </div>
      </div>
      <div id="page-summary-text"></div>
      <div id="brief-change" class="brief-change" hidden></div>
      <button id="summary-toggle" aria-expanded="false" data-i18n="briefShowFull">Expand</button>
    </section>

    <div class="section-head">
      <h2 data-i18n="headlines">Headlines</h2>
      <span class="status-line">
        <span class="status-strip" id="status-strip">&#9679; Live</span>
        <span id="status-text">Loading</span>
        <span id="article-count"></span>
      </span>
    </div>
    <div id="feed-container"></div>
  </div>

  <aside class="sidebar">
    <div class="panel">
      <div class="panel-head">
        <span class="label" data-i18n="latest">Latest</span>
        <span class="label" id="latest-provenance"></span>
      </div>
      <ul class="headlines-list" id="headlines-list"></ul>
    </div>
  </aside>
</main>

<button id="to-top" data-i18n-label="backToTop" aria-label="Back to top">&#8593;</button>

<footer>
  <div class="foot-inner">
    <span data-i18n="footerRegions">Daily Digest — Bangladesh, Australia, Global</span>
    <span id="foot-provenance">Refreshed twice daily via GitHub Actions</span>
  </div>
</footer>

<!-- Loaded before app.js, and both deferred: deferred scripts run in
     document order, so initSqlJs is defined by the time app.js needs it.
     locateFile in app.js points this at the matching .wasm file. -->
<script src="vendor/sql-wasm-1.13.0.js" defer></script>
<script src="app.js?v=e55dbc9168b2" defer></script>
</body>
</html>
