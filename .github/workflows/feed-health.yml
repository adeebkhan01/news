name: Feed Health

# Reports which configured feeds still return articles, and lets you try
# candidate replacement URLs before editing the source list. Commits nothing.
on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to check (bd, au, global, or blank for all)'
        required: false
        default: ''
      candidates:
        description: 'Space-separated candidate feed URLs to try as well'
        required: false
        # Alternates for the feeds in fetch.js that have never been verified.
        # Those are checked as *configured* feeds — including on the weekly
        # scheduled run, which gets no dispatch inputs at all and so never sees
        # this list. It is only what to fall back to once one of them reports
        # DEAD or STALE: dispatch by hand and swap in whichever comes back ok.
        #
        # BTV first, as the least certain: it is a government site that may
        # publish no feed at all. Its Google News route leads, since that is how
        # Amar Desh got in — but a state broadcaster's Google News presence can
        # be thin, so a site: query returning nothing is a real outcome and
        # retiring BTV is then the answer.
        #
        # The dailyamardesh.com paths stay listed. Amar Desh now comes in via
        # Google News, but a feed of its own would be better — direct article
        # links instead of Google redirects, and images — so if one of these
        # ever answers, it is worth switching to.
        default: >-
          https://news.google.com/rss/search?q=site:btv.gov.bd&hl=bn&gl=BD&ceid=BD:bn
          https://www.btv.gov.bd/feed
          https://btv.gov.bd/rss.xml
          https://www.dailyamardesh.com/rss.xml
          https://www.dailyamardesh.com/rss/rss.xml
          https://www.dailyamardesh.com/feed
          https://rss.cnn.com/rss/edition.rss
          https://rss.cnn.com/rss/money_latest.rss
          https://www.observerbd.com/rss.xml
          https://www.banglanews24.com/english/rss/rss.xml
          https://bdnews24.com/feed
  schedule:
    - cron: '17 6 * * 1'   # Monday morning, so dead feeds surface weekly

# Reads the source list, fetches feeds, writes nothing back.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a tag: a tag can be moved to point at new code,
      # a commit SHA cannot. Dependabot raises a PR when there is a newer one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # this job never pushes

      # Inputs go through the environment, never string-interpolated into the
      # script, so a crafted input can't run as shell.
      - name: Check feeds
        env:
          REGION: ${{ inputs.region }}
          CANDIDATES: ${{ inputs.candidates }}
        run: |
          args=()
          [ -n "$REGION" ] && args+=(--region "$REGION")
          for url in $CANDIDATES; do
            case "$url" in
              https://*|http://*) args+=("$url") ;;
              *) echo "Ignoring non-URL candidate: $url" ;;
            esac
          done
          node tools/check-feeds.js "${args[@]}"
