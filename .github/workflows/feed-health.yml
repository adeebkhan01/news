name: Feed Health

# Reports which configured feeds still return articles, and lets you try
# candidate replacement URLs before editing the source list. Commits nothing.
on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to check (bd, au, global, or blank for all)'
        required: false
        default: ''
      candidates:
        description: 'Space-separated candidate feed URLs to try as well'
        required: false
        # Alternates for the feeds in fetch.js that have never been verified.
        # Those are checked as *configured* feeds — including on the weekly
        # scheduled run, which gets no dispatch inputs at all and so never sees
        # this list. It is only what to fall back to once one of them reports
        # DEAD or STALE: dispatch by hand and swap in whichever comes back ok.
        #
        # The publishers' own feeds, for the four sources that currently come
        # in through Google News. That route costs direct article links and
        # images, so it is a rescue rather than a preference: if one of these
        # ever answers, switch the source back to it. Amar Desh is the worked
        # example — /feed answered on 2026-09-14 and it went straight back.
        #
        # Dhaka Tribune and New Age returned 403 and UNB 404, so these are the
        # other paths worth trying rather than the ones already known dead.
        default: >-
          https://www.dhakatribune.com/rss.xml
          https://www.dhakatribune.com/feed/rss.xml
          https://www.newagebd.net/feed
          https://www.newagebd.net/rss.xml
          https://unb.com.bd/feed
          https://unb.com.bd/rss.xml
          https://www.btv.gov.bd/rss/rss.xml
  schedule:
    - cron: '17 6 * * 1'   # Monday morning, so dead feeds surface weekly

# Reads the source list, fetches feeds, writes nothing back.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a tag: a tag can be moved to point at new code,
      # a commit SHA cannot. Dependabot raises a PR when there is a newer one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # this job never pushes

      # Inputs go through the environment, never string-interpolated into the
      # script, so a crafted input can't run as shell.
      - name: Check feeds
        env:
          REGION: ${{ inputs.region }}
          CANDIDATES: ${{ inputs.candidates }}
        run: |
          args=()
          [ -n "$REGION" ] && args+=(--region "$REGION")
          for url in $CANDIDATES; do
            case "$url" in
              https://*|http://*) args+=("$url") ;;
              *) echo "Ignoring non-URL candidate: $url" ;;
            esac
          done
          node tools/check-feeds.js "${args[@]}"
