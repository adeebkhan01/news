name: Fetch RSS Feeds

on:
  schedule:
    # Twice a day. Off the hour because scheduled runs queue at :00.
    - cron: '20 0,12 * * *'
  workflow_dispatch:

# contents: write is the whole grant, and it is needed only by the last step —
# the one that commits the refreshed data files back to main. Nothing else in
# this workflow writes anything, and no other scope is available to it.
permissions:
  contents: write

# A slow run must not overlap the next scheduled one and race it to the push.
concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      # Pinned to a commit, not a tag: a tag can be moved to point at new code,
      # a commit SHA cannot. Dependabot raises a PR when there is a newer one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch feeds
        run: |
          node fetch.js --region bd
          node fetch.js --region au
          node fetch.js --region global
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # The gate between fetching and publishing. The suite re-checks every
      # article that was just written — every link https, every image on a host
      # the CSP will actually allow — so a feed that starts serving something
      # the rules refuse fails the run instead of being committed. A failed
      # step fails the job, and the commit step below never runs: the data file
      # already on main stays up rather than being replaced by a bad one.
      - name: Validate before publishing
        run: node --test tests/*.test.js

      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # archive/ carries the dated snapshots each run writes, and the
          # pruning of ones past the retention window — so it is staged with
          # -A rather than by name: a deletion is a change that has to travel
          # with the run that made it, or the next run prunes the same files
          # again forever.
          git add data-bd.json data-au.json data-global.json
          git add -A archive
          git diff --staged --quiet && { echo "No data changes"; exit 0; }
          git commit -m "chore: refresh feeds $(date -u '+%Y-%m-%d %H:%M UTC')"
          # main moves under us when several runs land close together.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push failed (attempt $attempt) — rebasing on origin/main"
            git pull --rebase origin main || exit 1
          done
          echo "Could not push after 3 attempts"; exit 1
